name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK (preinstalled on runner)
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Write signing keystore (from repo secret)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore
            echo "Release keystore written"
          else
            echo "::warning::KEYSTORE_BASE64 secret not set - APK will be signed with a debug key"
          fi

      - name: Run unit tests
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --no-daemon

      - name: Upload test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-shots
          path: app/build/shots/
          retention-days: 14
          if-no-files-found: warn

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: liquiddialer
          VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/liquid-dialer.apk
          rm -f app/release.keystore
          ls -la dist/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: liquid-dialer-apk
          path: dist/liquid-dialer.apk
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Liquid Dialer v1.0.${{ github.run_number }}
          body: |
            Liquid Dialer APK built by GitHub Actions (run ${{ github.run_number }}, commit ${{ github.sha }}).
            Download **liquid-dialer.apk**, open it on your phone and allow "Install unknown apps".
            First launch: tap "Default phone app banao" and choose Liquid Dialer, then allow permissions.
            Android 8.0+ phones. Updates install over the old version (same signing key).
          files: dist/liquid-dialer.apk
          make_latest: true
